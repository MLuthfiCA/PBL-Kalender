<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>formulir dengan css eksternal</title>
    <link rel="stylesheet" href="../CSS/admin_homepage.css" />
  </head>

  <body>
    <form action="#" method="post">
      <img
        src="../mentahan_profil-removebg-preview.png"
        alt="logo"
        width="100"
        length="100"
      />
      <h3 style="text-align: center; color: #000000">MASUK</h3>
      <label style="color: #000000" for="nama">Nama Akun</label>
      <input
        type="text"
        id="nama"
        class="input-field"
        name="nama"
        placeholder="masukkan nama akun anda"
        required
      />

      <label style="color: #000000" for="password">Kata Sandi</label>
      <input
        type="password"
        id="password"
        class="input-field"
        name="password"
        placeholder="masukkan masukkan kata sandi"
        required
      />
      <a href="login_page.html">KHUSUS ADMIN</a>
      <button type="button" id="loginBtn" disabled>Login</button>

      <script>
        const userBenar = "admin";
        const passBenar = "12345";

        const namaInput = document.getElementById("nama");
        const passInput = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");

        function cekInput() {
          if (
            namaInput.value.trim() === userBenar &&
            passInput.value.trim() === passBenar
          ) {
            loginBtn.disabled = false;
          } else {
            loginBtn.disabled = true;
          }
        }

        namaInput.addEventListener("input", cekInput);
        passInput.addEventListener("input", cekInput);

        loginBtn.addEventListener("click", function () {
          window.location.href = "admin_homepage.html";
        });
      </script>
    </form>
  </body>
</html>
