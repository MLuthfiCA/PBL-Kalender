    header("Location: login.php");
    exit();
}

$mahasiswa_id = $_SESSION["mahasiswa_id"];

// SIMPAN CATATAN BARU
if (isset($_POST['simpan_catatan'])) {
    $isi = mysqli_real_escape_string($db, $_POST['catatan']);
    $tanggal = date("Y-m-d");

    if (!empty($isi)) {
        $sql = "INSERT INTO catatan_pribadi (mahasiswa_id, tanggal, isi) 
                VALUES ('$mahasiswa_id', '$tanggal', '$isi')";
        mysqli_query($db, $sql);
    }

    header("Location: Catatan_page.php");
    exit();
}

// AMBIL CATATAN LAMA UNTUK MAHASISWA INI
$sql = "SELECT id, tanggal, isi 
        FROM catatan_pribadi 
        WHERE mahasiswa_id = '$mahasiswa_id'
        ORDER BY id DESC";
$result = mysqli_query($db, $sql);
